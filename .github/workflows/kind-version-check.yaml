name: Check that we know about latest Kind release

on:
  push:
    branches:
      - master
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 4'

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  kind-version-check:
    runs-on: ubuntu-slim
    steps:
      - run: curl -sSL --fail-with-body -o kind-releases.json https://api.github.com/repos/kubernetes-sigs/kind/releases
      - run: jq -e --arg VERSION v0.33.0 '.[0].name | debug(.) | . == $VERSION' kind-releases.json
