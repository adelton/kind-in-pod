name: Check that we know about latest Podman release

on:
  push:
    branches:
      - master
  workflow_dispatch:
  schedule:
    - cron: '18 6 * * 4'

jobs:
  podman-version-check:
    runs-on: ubuntu-latest
    steps:
      - run: curl -sSL --fail-with-body -o podman-stable.json https://quay.io/api/v1/repository/podman/stable
      - run: jq -e --arg VERSION v6.2 '.tags.latest.manifest_digest as $latest_digest | debug($latest_digest) | $latest_digest == .tags[$ARGS.named.VERSION].manifest_digest' podman-stable.json
      - run: jq '.tags.latest.manifest_digest as $latest_digest | .tags[] | select(.manifest_digest == $latest_digest)' podman-stable.json
        if: failure()
