name: Wait for Kubernetes to be up
runs:
  using: composite
  steps:
    - name: Wait for a Ready node and the serviceaccount/default
      run: |
        ( set +x ; while true ; do if kubectl get nodes | tee /dev/stderr | grep -q '\bReady\b' ; then break ; else sleep 5 ; fi ; done )
        ( set +x ; while ! kubectl get serviceaccount/default ; do sleep 5 ; done )
      shell: bash -euxo pipefail {0}
    - name: Wait for kubectl get pods --all-namespaces
      run: |
        kubectl get pods --all-namespaces
        set +x
        ( while ! kubectl get --no-headers=true pods -A | grep '\bcoredns\b' > /dev/null ; do kubectl get --no-headers=true pods -A ; echo --- ; sleep 5 ; done )
        ( while kubectl get --no-headers=true pods -A 2>&1 | grep -v -E '\b([123])/\1  *Running\b|\b0/1  *Completed\b' ; do echo --- ; sleep 5 ; done )
        set -x
        kubectl get all -A
      shell: bash -euxo pipefail {0}
