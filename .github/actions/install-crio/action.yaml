name: Install and setup CRI-O
runs:
  using: composite
  steps:
    - run: |
        [ -n "$CRIO_VERSION" ] || exit 1

        curl -fsSL https://download.opensuse.org/repositories/isv:/cri-o:/stable:/$CRIO_VERSION/deb/Release.key \
            | gpg --dearmor | sudo tee /etc/apt/keyrings/cri-o-apt-keyring.gpg > /dev/null
        echo "deb [signed-by=/etc/apt/keyrings/cri-o-apt-keyring.gpg] https://download.opensuse.org/repositories/isv:/cri-o:/stable:/$CRIO_VERSION/deb/ /" \
            | sudo tee /etc/apt/sources.list.d/cri-o.list
        sudo apt update
        sudo apt install -y cri-o

        sudo rm -f /etc/cni/net.d/*.conflist
        sudo cp .github/actions/cni-10-bridge.conflist /etc/cni/net.d/10-bridge.conflist

        # Workaround https://github.com/rancher/rke2/issues/11716
        sudo mkdir -p /etc/crio/crio.conf.d
        printf '[crio.runtime]\ndefault_sysctls = ["net.ipv4.ip_unprivileged_port_start=0"]\n' | sudo tee /etc/crio/crio.conf.d/90-unprivileged-ports.conf

        sudo systemctl start crio.service
      shell: bash -euxo pipefail {0}
