name: Install and start RKE2
runs:
  using: composite
  steps:
    - id: rke2-version-live
      name: Get current stable RKE2 version
      run: |
        out=~/.cache/rke2-stable-release/response
        mkdir -p "${out%/*}"
        if curl -sSi --fail-with-body -o "$out" https://update.rke2.io/v1-release/channels/stable ; then
            version=$( sed -n '/^location:/I { s|.*/||; s/%2B/+/; s/\r$//; p ; x }' "$out" )
            if [ -n "$version" ] ; then
                echo "version=$version" | tee -a "$GITHUB_OUTPUT"
                exit
            fi
        fi
        echo "::warning::update.rke2.io did not return a stable release location"
        cat "$out" || true
      shell: bash -euxo pipefail {0}
    - id: rke2-version-cached
      name: Look at the last seen stable RKE2 version in cache
      uses: actions/cache/restore@v6
      with:
        path: ~/.cache/rke2-stable-release
        key: rke2-stable-release-unknown
        restore-keys: rke2-stable-release-
        fail-on-cache-miss: ${{ steps.rke2-version-live.outputs.version == '' }}
        lookup-only: ${{ steps.rke2-version-live.outputs.version != '' }}
    - id: rke2-version
      name: Use RKE2 version from cached result
      run: |
        version="${RKE2_VERSION_CACHED#rke2-stable-release-}"
        echo "::notice::Using RKE2 version $version found in cache"
        cat ~/.cache/rke2-stable-release/response
        echo "version=$version" | tee -a "$GITHUB_OUTPUT"
      env:
        RKE2_VERSION_CACHED: ${{ steps.rke2-version-cached.outputs.cache-matched-key }}
      shell: bash -euxo pipefail {0}
      if: steps.rke2-version-live.outputs.version == ''
    - name: Run curl -sfL https://get.rke2.io | sudo INSTALL_RKE2_VERSION="${{ env.INSTALL_RKE2_VERSION }}" sh -
      run: |
        sudo mkdir -p /etc/rancher/rke2/config.yaml.d
        if [ -e /var/run/crio/crio.sock ] ; then
            echo "container-runtime-endpoint: /var/run/crio/crio.sock" | sudo tee /etc/rancher/rke2/config.yaml.d/70-crio.yaml
        elif [ -e /var/run/containerd/containerd.sock ] ; then
            echo "container-runtime-endpoint: /var/run/containerd/containerd.sock" | sudo tee /etc/rancher/rke2/config.yaml.d/70-containerd.yaml
        fi

        curl -sfL https://get.rke2.io | sudo INSTALL_RKE2_VERSION="$INSTALL_RKE2_VERSION" sh -
        sudo systemctl start rke2-server.service
        systemctl status rke2-server.service
        mkdir ~/.kube
        sudo cat /etc/rancher/rke2/rke2.yaml > ~/.kube/config
        sudo ln -s /var/lib/rancher/rke2/bin/kubectl /usr/local/bin
      env:
        INSTALL_RKE2_VERSION: ${{ steps.rke2-version-live.outputs.version }}${{ steps.rke2-version.outputs.version }}
      shell: bash -euxo pipefail {0}
    - uses: ./.github/actions/wait-for-k8s
    - run: |
        kubectl apply -f https://raw.githubusercontent.com/rancher/local-path-provisioner/master/deploy/local-path-storage.yaml
        kubectl patch storageclass local-path -p '{"metadata": {"annotations":{"storageclass.kubernetes.io/is-default-class":"true"}}}'
      shell: bash -euxo pipefail {0}
    - name: Cache ${{ steps.rke2-version-live.outputs.version }} as the current stable RKE2 version
      uses: actions/cache/save@v6
      with:
        path: ~/.cache/rke2-stable-release
        key: rke2-stable-release-${{ steps.rke2-version-live.outputs.version }}
      if: |
        steps.rke2-version-live.outputs.version != ''
          && steps.rke2-version-cached.outputs.cache-matched-key != format('rke2-stable-release-{0}', steps.rke2-version-live.outputs.version)
